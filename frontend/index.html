<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM Debate Studio</title>
    <meta name="theme-color" content="#f5f6f8" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=20260930-design-2" />
    <link rel="stylesheet" href="/assets/styles.css?v=20260930-design-2" />
  </head>
  <body>
    <div class="app-shell">
      <a class="skip-link" href="#workspaceMain">跳到主工作区</a>
      <aside id="sessionSidebar" class="sidebar panel" aria-label="历史辩论">
        <div class="brand-block">
          <img class="brand-mark" src="/assets/favicon.svg?v=20260930-design-2" alt="" width="32" height="32" />
          <div><h1>LLM 辩论台</h1></div>
          <button id="closeSidebarBtn" class="sidebar-close icon-button" type="button" aria-label="收起历史侧栏" title="收起历史侧栏">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 7-5 5 5 5" /></svg>
          </button>
        </div>
        <div class="sidebar-section-label"><span>历史记录</span></div>
        <div class="sidebar-header">
          <span>会话</span>
          <div class="sidebar-actions">
            <button id="archivedSessionsBtn" class="ghost-button compact-button" type="button">已归档</button>
            <button id="refreshSessionsBtn" class="ghost-button compact-button" type="button">刷新</button>
          </div>
        </div>
        <div id="historyList" class="history-list"></div>
        <div class="sidebar-footer"><span>本地存储</span></div>
      </aside>
      <button id="sidebarBackdrop" class="sidebar-backdrop" type="button" aria-label="收起历史侧栏" tabindex="-1"></button>

      <main id="workspaceMain" class="workspace" tabindex="-1">
        <header class="topbar panel">
          <button id="toggleSidebarBtn" class="sidebar-toggle icon-button" type="button" aria-controls="sessionSidebar" aria-expanded="true" aria-label="收起历史侧栏" title="收起历史侧栏">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1" /><path d="M9 4v16" /><path class="sidebar-toggle-chevron" d="m15 9-3 3 3 3" /></svg>
          </button>
          <div class="topbar-copy">
            <h2 id="currentHeadline">开始一场新的模型辩论</h2>
          </div>
          <div class="utility-dock" aria-label="快捷入口">
            <button id="newDebateBtn" class="icon-button" type="button" title="新辩论" aria-label="新辩论">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 6.5h8a4.5 4.5 0 0 1 4.5 4.5v2a4.5 4.5 0 0 1-4.5 4.5h-4.9l-3.1 2.6a.8.8 0 0 1-1.3-.62V17A4.5 4.5 0 0 1 3.5 13v-2A4.5 4.5 0 0 1 8 6.5Z" />
                <path d="M12 9.6v4.8" />
                <path d="M9.6 12h4.8" />
              </svg>
            </button>
            <button id="settingsBtn" class="icon-button icon-button-accent" type="button" title="设置" aria-label="设置">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065" />
                <path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" />
              </svg>
            </button>
          </div>
        </header>

        <section id="debateView" class="view view-active debate-view mode-landing">
          <section id="landingPanel" class="landing-panel">
              <section class="control-panel">
                <div class="panel-head setup-heading">
                  <div class="setup-title">
                    <h3>辩论设置</h3>
                    <span id="runStatusBadge" class="status-badge">空闲中</span>
                  </div>
                  <button id="openChangelogBtn" class="changelog-button ghost-button compact-button" type="button" aria-haspopup="dialog" aria-controls="changelogModal">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.6 7M3 4v7h7M12 7v5l3 2" /></svg>
                    <span>更新记录</span>
                  </button>
                </div>
                <form id="debateForm" class="debate-form" onsubmit="return false">
                  <label class="topic-field">
                    <span>辩题 <small class="field-caption">TOPIC</small></span>
                    <textarea id="topicInput" rows="5" placeholder="输入一个值得交锋的问题，例如：生成式 AI 是否会显著提升中小企业效率？"></textarea>
                  </label>
                  <div id="homeDebaterBinding" class="home-binding-card"></div>
                  <div class="debate-launch-row">
                    <div class="form-grid round-inputs">
                      <label>
                        <span>最少轮数</span>
                        <input id="minRoundsInput" type="number" min="2" max="10" value="4" />
                      </label>
                      <label>
                        <span>最多轮数</span>
                        <input id="maxRoundsInput" type="number" min="2" max="10" value="6" />
                      </label>
                    </div>
                    <button id="startDebateBtn" class="launch-button" type="submit">开始辩论</button>
                  </div>
                  <p class="form-footnote">双方轮流发言，裁判总结评议。开始后可随时暂停或插入你的观点。</p>
                </form>
              </section>
          </section>

          <section id="livePanel" class="panel live-panel hidden">
            <div class="panel-head stage-head">
              <div>
                <h3 id="livePanelTitle">实时辩论中</h3>
              </div>
              <div class="stage-meta">
                <span id="liveStatusBadge" class="status-badge">运行中</span>
                <span id="sessionMeta" class="meta-text">会话准备中</span>
                <div class="stage-actions">
                  <button id="stopDebateBtn" class="danger-button compact-button" type="button">暂停辩论</button>
                  <button id="terminateDebateBtn" class="terminate-button compact-button" type="button">终止辩论</button>
                </div>
              </div>
            </div>
            <div id="chatThread" class="chat-thread full-thread"></div>
            <div id="liveComposerShell" class="live-composer-shell">
              <div id="queuedUserMessageSlot" class="queued-user-message-slot hidden"></div>
              <div class="live-composer-row">
                <label class="live-composer" aria-label="插入用户发言">
                  <div class="live-composer-frame">
                    <textarea
                      id="userInterjectionInput"
                      rows="2"
                      placeholder="在这里插入一条用户发言。运行中会等待当前辩手说完后插入；暂停时会直接加入当前界面。"
                    ></textarea>
                    <div class="live-composer-tools">
                      <div id="userTargetControl" class="composer-target-control">
                        <button id="toggleUserTargetMenuBtn" class="composer-plus-button" type="button" title="额外发送要求" aria-label="额外发送要求" aria-expanded="false">+</button>
                        <div id="userTargetTagSlot" class="composer-target-tag-slot hidden"></div>
                        <div id="userTargetMenu" class="composer-target-menu hidden">
                          <div id="userTargetMenuAnchor" class="composer-target-menu-anchor">
                            <button id="openUserTargetSubmenuBtn" class="composer-target-menu-item" type="button">
                              <span>发送对象</span>
                              <span class="composer-target-menu-arrow" aria-hidden="true">›</span>
                            </button>
                            <div id="userTargetSubmenu" class="composer-target-submenu hidden">
                              <button class="composer-target-submenu-item" type="button" data-target-role="pro">发送正方</button>
                              <button class="composer-target-submenu-item" type="button" data-target-role="con">发送反方</button>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </label>
                <p id="userComposerHint" class="composer-hint hidden"></p>
                <div class="live-composer-actions">
                  <button id="toggleUserComposerExpandBtn" class="icon-button icon-button-send icon-button-expand" type="button" title="展开编辑" aria-label="展开编辑" aria-expanded="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M8 4.75H4.75V8" />
                      <path d="M4.75 4.75 10 10" />
                      <path d="M16 19.25h3.25V16" />
                      <path d="M19.25 19.25 14 14" />
                    </svg>
                  </button>
                  <button id="sendUserMessageBtn" class="icon-button icon-button-send" type="button" title="发送用户发言" aria-label="发送用户发言">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M4 11.5 19.5 4l-4.2 16-3.9-5.2L4 11.5Z" />
                      <path d="M11.4 14.8 19.5 4" />
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </section>

          <section id="reviewPanel" class="panel review-panel hidden">
            <div class="panel-head stage-head">
              <div>
                <h3>辩论结果回看</h3>
              </div>
              <span id="reviewMeta" class="meta-text">已结束</span>
            </div>
            <div class="review-layout">
              <section class="review-summary-card">
                <div class="review-status-row">
                  <span id="reviewStatusBadge" class="status-badge">已结束</span>
                  <div class="review-actions">
                    <button id="exportSimpleBtn" class="ghost-button compact-button" type="button" disabled>预览简版</button>
                    <button id="exportDetailBtn" class="primary-button compact-button" type="button" disabled>预览细版</button>
                  </div>
                </div>
                <h4 id="resultWinner">等待会话</h4>
                <div id="resultScores" class="result-score-grid"></div>
                <div id="resultUsage" class="result-usage-grid hidden"></div>
                <div id="resultHighlights" class="result-highlights"></div>
                <p id="resultConclusion" class="result-conclusion">完成一场辩论后，这里会展示裁判总结。</p>
                <div id="resultErrorBox" class="result-error hidden"></div>
              </section>

              <section class="review-transcript-card">
                <div class="review-transcript-toolbar">
                  <button id="toggleReviewTopicBtn" class="ghost-button compact-button review-topic-toggle" type="button">查看辩题</button>
                  <button id="previewErrorBtn" class="danger-button compact-button review-error-button hidden" type="button">查看错误</button>
                  <div id="reviewTopicDisclosure" class="review-topic-disclosure hidden" role="dialog" aria-label="原始辩题">
                    <div id="reviewTopicField" class="review-topic-field"></div>
                  </div>
                </div>
                <div class="panel-head review-transcript-head">
                  <div>
                    <h3>辩论回放</h3>
                  </div>
                </div>
                <div id="reviewThread" class="chat-thread review-thread"></div>
              </section>
            </div>
          </section>
        </section>

      </main>
    </div>

    <div id="markdownPreviewModal" class="modal hidden">
      <div class="modal-card markdown-preview-modal-card panel">
        <div class="markdown-preview-toolbar">
          <div class="markdown-preview-actions">
            <button id="closeMarkdownPreviewBtn" class="ghost-button compact-button" type="button">关闭</button>
            <button id="downloadMarkdownPreviewBtn" class="primary-button compact-button" type="button" disabled>导出文件</button>
          </div>
          <div class="markdown-preview-title">
            <h3 id="markdownPreviewTitle">记录预览</h3>
          </div>
        </div>
        <div class="markdown-preview-frame">
          <div id="markdownPreviewViewer" class="record-viewer markdown-preview-viewer empty-viewer">选择一份记录后，会在这里以排版后的 Markdown 方式展示。</div>
        </div>
      </div>
    </div>

    <div id="changelogModal" class="modal hidden">
      <div class="modal-card changelog-modal-card panel">
        <div class="panel-head modal-head">
          <div><h3>更新记录</h3></div>
          <button id="closeChangelogBtn" class="ghost-button compact-button" type="button">关闭</button>
        </div>
        <div class="changelog-frame">
          <div id="changelogViewer" class="record-viewer changelog-viewer" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <div id="messageDetailModal" class="modal hidden">
      <div class="modal-card message-detail-modal-card panel">
        <div class="message-detail-toolbar">
          <div class="message-detail-title">
              <h3 id="messageDetailTitle">调用细节</h3>
          </div>
          <div class="message-detail-actions">
            <button id="closeMessageDetailBtn" class="ghost-button compact-button" type="button">关闭</button>
          </div>
        </div>
        <div id="messageDetailBody" class="message-detail-body"></div>
      </div>
    </div>

    <div id="appErrorToast" class="app-error-toast hidden" role="alert" aria-live="assertive">
      <span id="appErrorToastMessage" class="app-error-toast-message"></span>
      <button id="closeAppErrorToastBtn" class="app-error-toast-close" type="button" aria-label="关闭错误提示">×</button>
    </div>

    <div id="detailTextTaskBar" class="detail-text-task-bar hidden" role="status" aria-live="polite">
      <span class="detail-text-task-spinner" aria-hidden="true"></span>
      <span id="detailTextTaskLabel" class="detail-text-task-label">正在处理模型调用细节...</span>
      <button id="cancelDetailTextTaskBtn" class="detail-text-task-cancel" type="button" aria-label="取消当前翻译或总结">×</button>
    </div>

    <div id="settingsModal" class="modal hidden">
      <div class="modal-card panel">
        <div class="panel-head modal-head">
          <div>
            <h3>模型与工具设置</h3>
          </div>
          <div class="topbar-actions">
            <button id="closeSettingsBtn" class="ghost-button" type="button">关闭</button>
            <button id="saveSettingsBtn" class="primary-button" type="button">保存设置</button>
          </div>
        </div>
                <div id="settingsForm" class="settings-grid"></div>
        <div id="presetManagerPanel" class="preset-overlay hidden" aria-label="模型与工具配置"></div>
      </div>
    </div>
    <div id="archivedModal" class="modal hidden">
      <div class="modal-card archived-modal-card panel">
        <div class="panel-head modal-head">
          <div>
            <h3>已归档记录</h3>
          </div>
          <div class="topbar-actions">
            <button id="closeArchivedBtn" class="ghost-button" type="button">关闭</button>
          </div>
        </div>
        <div class="archived-modal-body">
          <div class="archived-modal-note">已归档的辩论仍可回放、恢复或永久删除。</div>
          <div id="archivedList" class="archived-list"></div>
        </div>
      </div>
    </div>
    <div id="titleEditModal" class="modal hidden">
      <div class="modal-card title-edit-modal-card panel">
        <div class="panel-head modal-head">
          <div>
            <h3>更改标题</h3>
          </div>
        </div>
        <div class="title-edit-body">
          <label class="title-edit-field">
            <span>标题</span>
            <input id="titleEditInput" type="text" maxlength="80" placeholder="输入新的标题" />
          </label>
          <div class="title-edit-actions">
            <button id="cancelTitleEditBtn" class="ghost-button" type="button">取消</button>
            <button id="confirmTitleEditBtn" class="primary-button" type="button">确认</button>
          </div>
        </div>
      </div>
    </div>

    <script defer src="/assets/motion.js?v=20260930-design-2"></script>
    <script defer src="/assets/app.js?v=20260930-design-2"></script>
    <script defer src="/assets/shell.js?v=20260930-design-2"></script>
  </body>
</html>
